[project]
name = "esp-migration-agent"
version = "0.1.0"
description = "Gated email-platform migration engine: LLM proposes, deterministic Python validates, human approves."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "faker>=30",
    "anthropic>=0.69",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-cov>=6.0",
]
# LLM Obs tracing (RC1-548). Deliberately not a hard dependency: telemetry is
# decoration, and the suite must pass with neither this group nor DD_API_KEY.
# Dev-machine runs that should trace: `uv sync --group obs`.
obs = [
    "ddtrace>=4.14,<5",
]
# Review-gate UI backend (RC1-560). Optional like obs: the migration pipeline
# and its tests never import it; only review_ui/ and its API tests do.
ui = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
# The shared eval harness (RC1-548), pinned by tag: if the ruler can move
# under a run, a changed score no longer says whether the subject drifted or
# the measurement did. v0.6.3 prices claude-opus-5-5 - the model both of this
# repo's LLM calls use - so run records carry real cost.
evals = [
    "agent-evals[sql,llmobs] @ git+https://github.com/snacksnack/agent-evals@v0.6.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
    "integration: end-to-end against a real target (skipped unless ESP_LISTMONK_* env is set)",
]

[tool.coverage.run]
source = ["specs", "seeding", "ingest", "discovery"]
