name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # --all-groups: the scorer tests import agent_evals and telemetry's
      # decline path is still what runs (no DD_API_KEY at module scope, no
      # LLM key at all). The billed suite itself (`python -m evals`) never
      # runs in CI.
      - name: Sync
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      # --ddtrace reports test-level results to Test Optimization, agentless
      # (ddtrace comes from the obs group now); --cov adds lines_pct.
      # Coverage is a signal, not a gate. Not a test credential: the suite
      # passes identically with no key.
      - name: Tests
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_CIVISIBILITY_AGENTLESS_ENABLED: "true"
          DD_SITE: datadoghq.com
          DD_SERVICE: esp-migration-agent
          DD_ENV: ci
        run: uv run pytest --ddtrace --cov

  # RC1-546: the full fixture into a real Listmonk, reconciliation at 100%,
  # second run converging to zero writes. Runs on every push, same as units -
  # a migration engine whose e2e only runs on demand is not tested.
  listmonk-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync
        run: uv sync

      - name: Start Listmonk
        run: docker compose up -d --wait

      - name: Bootstrap API user
        run: uv run python -m executor.bootstrap >> "$GITHUB_ENV"

      - name: Integration tests
        run: uv run pytest -m integration -v
