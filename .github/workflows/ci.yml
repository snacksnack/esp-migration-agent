name: CI

# push is scoped to main so a PR commit runs once (the pull_request event),
# not twice (RC1-558). The listmonk e2e lives in e2e.yml with a paths filter.
on:
  push:
    branches: [main]
  pull_request:

# A follow-up push cancels the superseded run, except on main, where every
# run completes (Test Optimization history and the DORA trail stay whole).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # --all-groups: the scorer tests import agent_evals and telemetry's
      # decline path is still what runs (no DD_API_KEY at module scope, no
      # LLM key at all). The billed suite itself (`python -m evals`) never
      # runs in CI.
      - name: Sync
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      # --ddtrace reports test-level results to Test Optimization, agentless
      # (ddtrace comes from the obs group now); --cov adds lines_pct.
      # Coverage is a signal, not a gate. Not a test credential: the suite
      # passes identically with no key.
      - name: Tests
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_CIVISIBILITY_AGENTLESS_ENABLED: "true"
          DD_SITE: datadoghq.com
          DD_SERVICE: esp-migration-agent
          DD_ENV: ci
        run: uv run pytest --ddtrace --cov

  # Review-gate UI (RC1-560): type-check, build, vitest. Node-only; the
  # backend's API tests run in the python job via the ui dependency group.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: review_ui/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: review_ui/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

      - name: Tests (vitest)
        run: npm test
